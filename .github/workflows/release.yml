name: Release

# Cut a release by pushing a version tag:
#   git tag v1.0.1 && git push origin v1.0.1
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Sanity-check the script
        run: |
          bash -n update-go
          shellcheck update-go

      - name: Stamp the release version into the script
        run: |
          sed -i "s/__UPDATE_GO_VERSION__/${GITHUB_REF_NAME#v}/" update-go

      - name: Generate checksums
        run: |
          sha256sum update-go > SHA256SUMS

      - name: Create release with the script attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "update-go ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            update-go SHA256SUMS
