name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The suite auto-adapts to the environment: it prefers an unprivileged
      # user namespace and falls back to HOME/install-root sandboxing where
      # namespaces are blocked (e.g. GitHub-hosted runners). Either way the
      # runner's system is never modified.
      - name: Run test suite
        run: tests/run.sh
